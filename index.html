<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Década de 90 · OLGA</title>
<style>
  :root {
    --bg: #f6f4ef; --card: #fff; --tx: #1d1d1b; --mut: #6b6860; --ln: #e2ded4;
    --acc: #b8462e; --acc2: #f3e3dc; --ok: #2e7d4f;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #17171a; --card: #212126; --tx: #ecebe8; --mut: #9a988f; --ln: #34343a; --acc: #e0775c; --acc2: #3a2621; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--tx); font: 14px/1.4 system-ui, "Segoe UI", sans-serif; }
  header { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 14px 20px; border-bottom: 1px solid var(--ln); background: var(--card); position: sticky; top: 0; z-index: 5; }
  header h1 { font-size: 20px; margin: 0; letter-spacing: -.02em; }
  header h1 span { color: var(--acc); }
  header .sp { flex: 1; }
  #quem { color: var(--mut); font-size: 13px; }
  button { font: inherit; border: 1px solid var(--ln); background: var(--card); color: var(--tx); border-radius: 6px; padding: 6px 12px; cursor: pointer; }
  button:hover { border-color: var(--acc); }
  button.pri { background: var(--acc); border-color: var(--acc); color: #fff; }
  button.perigo { color: #c0392b; }
  main { padding: 16px 20px 40px; max-width: 1500px; margin: 0 auto; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; margin-bottom: 14px; }
  .tile { background: var(--card); border: 1px solid var(--ln); border-radius: 8px; padding: 10px 14px; }
  .tile b { display: block; font-size: 22px; font-variant-numeric: tabular-nums; }
  .tile small { color: var(--mut); }
  .filtros { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; align-items: center; }
  input, select, textarea { font: inherit; color: var(--tx); background: var(--card); border: 1px solid var(--ln); border-radius: 6px; padding: 6px 8px; }
  #busca { flex: 1 1 240px; }
  .tabwrap { background: var(--card); border: 1px solid var(--ln); border-radius: 8px; overflow: auto; max-height: calc(100vh - 250px); }
  table { border-collapse: collapse; width: 100%; }
  th, td { padding: 7px 10px; border-bottom: 1px solid var(--ln); text-align: left; vertical-align: top; }
  th { position: sticky; top: 0; background: var(--card); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--mut); cursor: pointer; white-space: nowrap; user-select: none; }
  th.on { color: var(--acc); }
  td.n { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  th.n { text-align: right; }
  tbody tr { cursor: pointer; }
  tbody tr:hover { background: var(--acc2); }
  td.t { font-weight: 600; }
  td .sub { display: block; font-weight: 400; color: var(--mut); font-size: 12px; }
  .vazio { color: var(--mut); }
  .fest { display: inline-block; font-size: 11px; padding: 1px 6px; border-radius: 10px; background: var(--acc2); color: var(--acc); margin: 0 3px 2px 0; white-space: nowrap; }
  dialog { border: 1px solid var(--ln); border-radius: 10px; background: var(--card); color: var(--tx); width: min(720px, 94vw); padding: 0; }
  dialog::backdrop { background: rgba(0,0,0,.45); }
  dialog form { padding: 18px 20px; }
  dialog h2 { margin: 0 0 14px; font-size: 18px; }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px 12px; }
  .grid label { display: flex; flex-direction: column; gap: 3px; font-size: 12px; color: var(--mut); }
  .grid .w2 { grid-column: span 2; } .grid .w4 { grid-column: span 4; }
  .acoes { display: flex; gap: 8px; margin-top: 16px; }
  .acoes .sp { flex: 1; }
  #cinBox { margin-top: 16px; border-top: 1px solid var(--ln); padding-top: 12px; }
  #cinBox h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .05em; color: var(--mut); margin: 0 0 8px; display: flex; gap: 8px; align-items: center; }
  #cinBox h3 a { color: var(--acc); text-transform: none; letter-spacing: 0; font-weight: 400; }
  #cinBox p { margin: 6px 0; }
  #cinBox .meta { color: var(--mut); font-size: 12px; }
  img.mini { float: left; width: 30px; height: 45px; object-fit: cover; border-radius: 2px; margin: 0 9px 0 0; background: var(--ln); }
  .imggrid2 { display: grid; grid-template-columns: minmax(130px, 200px) 1fr; gap: 14px; align-items: start; }
  .imggrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
  .imgf { display: block; object-fit: cover; border-radius: 4px; border: 1px solid var(--ln); background: var(--ln); }
  .imgvazia { display: flex; align-items: center; justify-content: center; text-align: center; padding: 8px; border: 1px dashed var(--ln); border-radius: 4px; color: var(--mut); font-size: 11px; }
  .imgvazia.erro { border-color: #c0392b; color: #c0392b; }
  @media (max-width: 640px) { .imggrid2 { grid-template-columns: 1fr; } }
  .cand { display: flex; gap: 10px; align-items: center; padding: 6px 8px; border: 1px solid var(--ln); border-radius: 6px; margin: 5px 0; }
  .cand div { flex: 1; } .cand small { color: var(--mut); display: block; }
  .cand .pts { font-variant-numeric: tabular-nums; color: var(--mut); font-size: 12px; white-space: nowrap; }
  .cinbusca { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
  .cinbusca input { flex: 1 1 200px; }
  .tag { display: inline-block; font-size: 11px; padding: 1px 6px; border-radius: 10px; border: 1px solid var(--ln); color: var(--mut); margin-left: 6px; font-weight: 400; vertical-align: 1px; }
  details summary { cursor: pointer; color: var(--mut); font-size: 12px; }
  #msg { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); background: var(--tx); color: var(--bg); padding: 8px 16px; border-radius: 6px; opacity: 0; transition: opacity .2s; pointer-events: none; }
  #msg.on { opacity: 1; }
  @media (max-width: 640px) { .grid { grid-template-columns: 1fr 1fr; } .grid .w4 { grid-column: span 2; } main, header { padding-left: 12px; padding-right: 12px; } }
</style>
</head>
<body>
<header>
  <h1>Década de <span>90</span></h1>
  <small style="color:var(--mut)">filmes brasileiros 1990–2001</small>
  <div class="sp"></div>
  <span id="quem"></span>
  <button id="bNovo" class="pri" hidden>+ Filme</button>
  <button id="bCsv">Exportar CSV</button>
  <button id="bLogin">Entrar</button>
</header>
<main>
  <div class="tiles" id="tiles"></div>
  <div class="filtros">
    <input id="busca" type="search" placeholder="Buscar título, direção, produtora, distribuidora…">
    <select id="fAno"></select>
    <select id="fGen"></select>
    <select id="fFest">
      <option value="">Festivais: todos</option>
      <option value="brasilia">Brasília</option>
      <option value="gramado">Gramado</option>
      <option value="ambos">Brasília e Gramado</option>
      <option value="algum">Algum festival</option>
      <option value="nenhum">Nenhum festival</option>
    </select>
    <select id="fCin">
      <option value="">Cinemateca: todos</option>
      <option value="certo">Vinculados</option>
      <option value="duvida">Em dúvida</option>
      <option value="nao_achado">Não achados</option>
      <option value="pendente">Dúvida ou não achado</option>
      <option value="tmdb">Só TMDB</option>
      <option value="nenhum">Sem Cinemateca nem TMDB</option>
    </select>
    <select id="fUf"></select>
    <select id="fDist"></select>
    <button id="bLimpa">Limpar</button>
  </div>
  <div class="tabwrap"><table>
    <thead><tr id="cab"></tr></thead>
    <tbody id="lista"><tr><td class="vazio">Carregando…</td></tr></tbody>
  </table></div>
</main>

<dialog id="dlg"><form method="dialog" id="frm">
  <h2 id="dlgTit">Filme</h2>
  <div class="grid">
    <label class="w4">Título<input name="titulo" required></label>
    <label>Lançamento<input name="lancamento" type="number" min="1980" max="2010"></label>
    <label>Festival Brasília<input name="brasilia" type="number" min="1980" max="2010"></label>
    <label>Festival Gramado<input name="gramado" type="number" min="1980" max="2010"></label>
    <label>Gênero<input name="genero" list="dlGen"></label>
    <label class="w2">Direção<input name="diretor"></label>
    <label class="w2">Distribuidora<input name="distribuidora" list="dlDist"></label>
    <label class="w2">Produtora<input name="produtora"></label>
    <label>UF<input name="uf"></label>
    <label>Salas (máx)<input name="salas" type="number" min="0"></label>
    <label>Público<input name="publico" type="number" min="0"></label>
    <label>Renda (R$)<input name="renda" type="number" min="0" step="0.01"></label>
    <label class="w4">Observações<textarea name="obs" rows="3"></textarea></label>
  </div>
  <div id="cinBox"></div>
  <div class="acoes">
    <button type="button" id="bExcluir" class="perigo">Excluir</button>
    <div class="sp"></div>
    <button type="button" id="bFechar">Fechar</button>
    <button type="submit" id="bSalvar" class="pri">Salvar</button>
  </div>
</form></dialog>
<datalist id="dlGen"></datalist><datalist id="dlDist"></datalist>
<div id="msg"></div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';
import { getFirestore, collection, getDocs, doc, getDoc, setDoc, updateDoc, deleteDoc, deleteField, serverTimestamp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

const app = initializeApp({
  apiKey: "AIzaSyDIBhcsqlK3QebTmbWMNqsN_rPPybREj64",
  authDomain: "olga-suite.firebaseapp.com",
  projectId: "olga-suite",
});
const auth = getAuth(app), db = getFirestore(app);
const COL = 'decada90_filmes', DONO = 'lg.rchrd@gmail.com';
const FN_CIN = 'https://us-central1-olga-suite.cloudfunctions.net/cinemateca';
const FN_CIN_BUSCA = 'https://us-central1-olga-suite.cloudfunctions.net/cinematecaBusca';
const $ = id => document.getElementById(id);

let filmes = [], podeEditar = false, editando = null;
let ordem = { campo: 'titulo', dir: 1 };

const COLS = [
  ['titulo', 'Título'], ['lancamento', 'Lanç.', 'n'], ['fest', 'Festivais'], ['genero', 'Gênero'],
  ['distribuidora', 'Distribuidora'], ['salas', 'Salas', 'n'], ['publico', 'Público', 'n'],
  ['renda', 'Renda (R$)', 'n'], ['uf', 'UF'],
];
const NUM = ['lancamento', 'brasilia', 'gramado', 'salas', 'publico', 'renda'];
const fmt = (v, dec = 0) => v == null ? '' : Number(v).toLocaleString('pt-BR', { minimumFractionDigits: dec, maximumFractionDigits: dec });
const fmtData = s => /^\d{4}\.\d{2}\.\d{2}$/.test(s || '') ? s.split('.').reverse().join('/') : (s || '');  // 1994.07.29 → 29/07/1994
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const norm = s => String(s ?? '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
const toast = t => { const m = $('msg'); m.textContent = t; m.classList.add('on'); setTimeout(() => m.classList.remove('on'), 2200); };

async function carregar() {
  const snap = await getDocs(collection(db, COL));
  filmes = snap.docs.map(d => ({ id: d.id, ...d.data() }));
  montarFiltros();
  render();
}

function opcoes(sel, rot, vals) {
  const atual = sel.value;
  sel.innerHTML = `<option value="">${rot}: todos</option>` + vals.map(v => `<option value="${esc(v)}">${esc(v)}</option>`).join('');
  sel.value = vals.map(String).includes(atual) || atual === '__sem' ? atual : '';
}
function unicos(campo) {
  return [...new Set(filmes.map(f => f[campo]).filter(v => v != null && v !== ''))].sort((a, b) => String(a).localeCompare(String(b), 'pt-BR'));
}
function montarFiltros() {
  opcoes($('fAno'), 'Lançamento', unicos('lancamento'));
  $('fAno').insertAdjacentHTML('beforeend', '<option value="__sem">Sem lançamento</option>');
  opcoes($('fGen'), 'Gênero', unicos('genero'));
  opcoes($('fUf'), 'UF', unicos('uf'));
  opcoes($('fDist'), 'Distribuidora', unicos('distribuidora'));
  $('dlGen').innerHTML = unicos('genero').map(v => `<option value="${esc(v)}">`).join('');
  $('dlDist').innerHTML = unicos('distribuidora').map(v => `<option value="${esc(v)}">`).join('');
}

function filtrados() {
  const q = norm($('busca').value).trim(), ano = $('fAno').value, gen = $('fGen').value,
        fest = $('fFest').value, uf = $('fUf').value, dist = $('fDist').value, cin = $('fCin').value;
  return filmes.filter(f => {
    if (q && !norm([f.titulo, f.diretor, f.produtora, f.distribuidora, f.obs, f.sinopse, (f.elenco || []).join(' ')].join(' ')).includes(q)) return false;
    const st = f.cinemateca_id ? 'certo' : f.cinemateca_status;
    if (cin === 'tmdb') { if (f.cinemateca_id || !f.tmdb_id) return false; }
    else if (cin === 'nenhum') { if (f.cinemateca_id || f.tmdb_id) return false; }
    else if (cin === 'pendente' ? !(st === 'duvida' || st === 'nao_achado') : cin && st !== cin) return false;
    if (ano === '__sem' ? f.lancamento != null : ano && String(f.lancamento) !== ano) return false;
    if (gen && f.genero !== gen) return false;
    if (uf && f.uf !== uf) return false;
    if (dist && f.distribuidora !== dist) return false;
    const b = f.brasilia != null, g = f.gramado != null;
    if (fest === 'brasilia' && !b || fest === 'gramado' && !g || fest === 'ambos' && !(b && g)
        || fest === 'algum' && !(b || g) || fest === 'nenhum' && (b || g)) return false;
    return true;
  });
}

function render() {
  const lista = filtrados();
  const { campo, dir } = ordem;
  const val = f => campo === 'fest' ? Math.min(f.brasilia ?? 9999, f.gramado ?? 9999) : f[campo];
  lista.sort((a, b) => {
    const x = val(a), y = val(b);
    if (x == null || x === 9999) return 1;
    if (y == null || y === 9999) return -1;
    return (typeof x === 'number' ? x - y : String(x).localeCompare(String(y), 'pt-BR')) * dir;
  });

  const soma = c => lista.reduce((s, f) => s + (f[c] || 0), 0);
  $('tiles').innerHTML = [
    [fmt(lista.length), lista.length === filmes.length ? 'filmes' : `de ${fmt(filmes.length)} filmes`],
    [fmt(lista.filter(f => f.lancamento != null).length), 'com lançamento comercial'],
    [fmt(soma('publico')), 'público somado'],
    ['R$ ' + fmt(soma('renda')), 'renda somada'],
    [fmt(lista.filter(f => f.brasilia != null).length) + ' / ' + fmt(lista.filter(f => f.gramado != null).length), 'em Brasília / Gramado'],
    [fmt(lista.filter(f => f.cinemateca_id).length), 'vinculados à Cinemateca'],
  ].map(([b, s]) => `<div class="tile"><b>${b}</b><small>${s}</small></div>`).join('');

  $('cab').innerHTML = COLS.map(([c, r, n]) =>
    `<th data-c="${c}" class="${n || ''} ${c === campo ? 'on' : ''}">${r}${c === campo ? (dir > 0 ? ' ▲' : ' ▼') : ''}</th>`).join('');

  $('lista').innerHTML = lista.length ? lista.map(f => `<tr data-id="${esc(f.id)}">
    <td class="t">${f.poster ? `<img class="mini" src="${esc(imgSrc(f.poster, 'w200').replace('/t/p/w780/', '/t/p/w92/'))}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">` : ''}${esc(f.titulo)}${f.cinemateca_id ? '' : f.tmdb_id ? '<span class="tag">TMDB</span>' : f.cinemateca_status ? `<span class="tag">${f.cinemateca_status === 'duvida' ? 'dúvida Cinemateca' : 'sem Cinemateca'}</span>` : ''}<span class="sub">${esc(f.diretor)}${f.duracao ? ' · ' + f.duracao + ' min' : ''}</span></td>
    <td class="n">${f.lancamento ?? ''}${f.lancamento_cin ? `<span class="sub">${fmtData(f.lancamento_cin).slice(0, 5)}</span>` : ''}</td>
    <td>${f.brasilia != null ? `<span class="fest">Brasília ${f.brasilia}</span>` : ''}${f.gramado != null ? `<span class="fest">Gramado ${f.gramado}</span>` : ''}</td>
    <td>${esc(f.genero)}</td>
    <td>${esc(f.distribuidora)}</td>
    <td class="n">${fmt(f.salas)}</td>
    <td class="n">${fmt(f.publico)}</td>
    <td class="n">${fmt(f.renda)}</td>
    <td>${esc(f.uf)}</td>
  </tr>`).join('') : `<tr><td colspan="${COLS.length}" class="vazio">Nenhum filme com esses filtros.</td></tr>`;
}

$('cab').addEventListener('click', e => {
  const c = e.target.closest('th')?.dataset.c; if (!c) return;
  ordem = ordem.campo === c ? { campo: c, dir: -ordem.dir } : { campo: c, dir: NUM.includes(c) && c !== 'lancamento' ? -1 : 1 };
  render();
});
const FILTROS = ['busca', 'fAno', 'fGen', 'fFest', 'fUf', 'fDist', 'fCin'];
FILTROS.forEach(id => $(id).addEventListener('input', render));
$('bLimpa').onclick = () => { FILTROS.forEach(id => $(id).value = ''); render(); };

// ----- ficha -----
const frm = $('frm');
function abrir(f) {
  editando = f;
  $('dlgTit').textContent = f ? f.titulo : 'Novo filme';
  for (const el of frm.elements) if (el.name) { el.value = f?.[el.name] ?? ''; el.disabled = !podeEditar; }
  $('bSalvar').hidden = !podeEditar;
  $('bExcluir').hidden = !podeEditar || !f;
  renderCin();
  $('dlg').showModal();
}

// ----- Filmografia Brasileira (Cinemateca) -----
function nomeElenco(s) {  // 'Montenegro, Fernanda (Dora)' → 'Fernanda Montenegro (Dora)'
  const m = s.match(/^([^,(]+),\s*([^(]+?)\s*(\(.*\))?$/);
  return m ? `${m[2]} ${m[1]} ${m[3] || ''}`.trim() : s;
}
function derivadosCin(cd) {
  const o = { cinemateca_id: cd.ID, cinemateca: cd, cinemateca_status: 'certo', cinemateca_candidatos: deleteField() };
  if (cd['Sinopse']) o.sinopse = cd['Sinopse'];
  const dur = String(cd['Material original'] || '').match(/(\d+)\s*min/);
  if (dur) o.duracao = Number(dur[1]);
  const el = cd['Identidades/elenco:'];
  if (el) o.elenco = (Array.isArray(el) ? el : [el]).map(nomeElenco);
  const lc = cd['Data e local de lançamento'];
  if (lc && lc.Data) o.lancamento_cin = Array.isArray(lc.Data) ? lc.Data[0] : lc.Data;
  if (cd['Prêmios']) o.premios = cd['Prêmios'];
  return o;
}
function candHtml(cs) {
  return cs.map(c => `<div class="cand"><div><b>${esc(c.titulo)}</b> (${c.ano ?? '?'})
      <small>${esc(c.direcao || 'direção não informada')} · ${esc(c.categoria || '')} · cód. ${esc(c.codigo)}</small></div>
      <span class="pts">${c.pontos != null ? c.pontos + ' pts' : ''}</span>
      <a href="https://bases.cinemateca.org.br/cgi-bin/wxis.exe/iah/?IsisScript=iah/iah.xis&base=FILMOGRAFIA&lang=p&nextAction=lnk&exprSearch=ID=${esc(c.codigo)}&format=detailed.pft" target="_blank" rel="noopener">ver</a>
      ${podeEditar ? `<button type="button" data-vincular="${esc(c.codigo)}">É este</button>` : ''}</div>`).join('');
}
function renderCin() {
  const f = editando, box = $('cinBox');
  if (!f) { box.innerHTML = ''; return; }
  let h = '';
  if (f.cinemateca_id) {
    const url = f.cinemateca?.URL || '';
    h += `<h3>Filmografia Brasileira <a href="${esc(url)}" target="_blank" rel="noopener">cód. ${esc(f.cinemateca_id)} ↗</a>
      ${podeEditar ? '<button type="button" id="bDesvincular" style="margin-left:auto;font-size:12px">Desvincular</button>' : ''}</h3>`;
    const meta = [f.cinemateca?.Categorias, f.duracao && f.duracao + ' min', f.lancamento_cin && 'lançamento ' + fmtData(f.lancamento_cin)].filter(Boolean);
    if (meta.length) h += `<p class="meta">${esc(meta.join(' · '))}</p>`;
    if (f.sinopse) h += `<p>${esc(f.sinopse)}</p>`;
    if (f.elenco?.length) h += `<p class="meta"><b>Elenco:</b> ${esc(f.elenco.slice(0, 12).join(', '))}${f.elenco.length > 12 ? '…' : ''}</p>`;
    if (f.premios) h += `<details><summary>Prêmios</summary><p class="meta">${esc(f.premios)}</p></details>`;
  } else {
    h += `<h3>Filmografia Brasileira</h3>`;
    const cs = f.cinemateca_candidatos || [];
    h += cs.length ? `<p class="meta">${f.cinemateca_status === 'duvida' ? 'Não tenho certeza — qual destes é o filme?' : 'Nenhum candidato bom; os mais próximos:'}</p>${candHtml(cs)}`
                   : `<p class="meta">Ainda não vinculado.</p>`;
  }
  if (podeEditar && !f.cinemateca_id) {
    h += `<div class="cinbusca"><input id="cinQ" placeholder="Buscar outro título na Cinemateca" value="${esc(f.titulo)}">
      <button type="button" id="bCinBusca">Buscar</button>
      <input id="cinCod" placeholder="ou código" style="flex:0 1 110px"><button type="button" id="bCinCod">Vincular</button></div>
      <div id="cinRes"></div>`;
  }
  h += tmdbHtml(f);
  h += imagensHtml(f);
  box.innerHTML = h;
}

// ----- TMDB (filmes sem Cinemateca) -----
const TMDB_KEY = '06567bcb467a70e4cdae54a19c4b72bf', TMDB_API = 'https://api.themoviedb.org/3';
const tmdbGet = async (path, p = {}) => {
  const r = await fetch(`${TMDB_API}${path}?` + new URLSearchParams({ api_key: TMDB_KEY, ...p }));
  if (!r.ok) throw new Error('TMDB ' + r.status);
  return r.json();
};
const poster = p => p ? `<img src="https://image.tmdb.org/t/p/w92${esc(p)}" style="width:46px;height:69px;object-fit:cover;border-radius:3px" loading="lazy">` : '';
function tmdbCandHtml(cs) {
  return cs.map(c => `<div class="cand">${poster(c.poster)}<div><b>${esc(c.titulo)}</b> (${c.ano ?? '?'})
      <small>${c.titulo_original && c.titulo_original !== c.titulo ? '<i>' + esc(c.titulo_original) + '</i> · ' : ''}${esc(c.direcao || 'direção não informada')} · ID ${c.id}</small></div>
      <span class="pts">${c.pontos != null ? c.pontos + ' pts' : ''}</span>
      <a href="https://www.themoviedb.org/movie/${c.id}" target="_blank" rel="noopener">ver</a>
      ${podeEditar ? `<button type="button" data-tmdb="${c.id}">É este</button>` : ''}</div>`).join('');
}
// ----- Imagens (só links: poster, foto_principal + legenda, fotos [{url, legenda}]) -----
const TMDB_IMG = 'https://image.tmdb.org/t/p/';
function imgSrc(url, tam) {  // link do Drive → miniatura exibível (arquivo compartilhado "qualquer pessoa com o link")
  const m = String(url || '').match(/drive\.google\.com\/(?:file\/d\/|open\?id=|uc\?(?:export=\w+&)?id=|thumbnail\?id=)([\w-]{20,})/);
  if (m) return `https://drive.google.com/thumbnail?id=${m[1]}&sz=${tam || 'w1200'}`;
  if (/dropbox\.com/.test(url)) return /[?&]dl=0/.test(url) ? url.replace(/([?&])dl=0/, '$1raw=1') : url + (url.includes('?') ? '&' : '?') + 'raw=1';
  return url;
}
function imgBox(url, alt, estilo) {
  if (!url) return `<div class="imgvazia" style="${estilo}">sem imagem</div>`;
  return `<a href="${esc(url)}" target="_blank" rel="noopener" title="Abrir original"><img src="${esc(imgSrc(url))}" alt="${esc(alt)}" referrerpolicy="no-referrer" loading="lazy" style="${estilo}" class="imgf" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'imgvazia erro',textContent:'não foi possível exibir — o link é público?',style:this.getAttribute('style')}))"></a>`;
}
function imagensHtml(f) {
  const fotos = f.fotos || [];
  const dica = '<p class="meta" style="font-size:11px">Cole links de imagem (Drive, site, TMDB…). No Drive, compartilhe o arquivo como “Qualquer pessoa com o link”.</p>';
  let h = `<div style="margin-top:14px"><h3>Imagens</h3>
    <div class="imggrid2"><div>${imgBox(f.poster, 'Cartaz', 'width:100%;aspect-ratio:2/3')}<p class="meta">Cartaz</p>
      ${podeEditar ? `<div class="cinbusca"><input id="imgPoster" placeholder="link do cartaz" value="${esc(f.poster || '')}"><button type="button" id="bImgPoster">Salvar</button></div>` : ''}</div>
    <div>${imgBox(f.foto_principal, 'Foto principal', 'width:100%;aspect-ratio:16/9')}<p class="meta">Foto principal${f.foto_principal_legenda ? ' — ' + esc(f.foto_principal_legenda) : ''}</p>
      ${podeEditar ? `<div class="cinbusca"><input id="imgPrinc" placeholder="link da foto principal" value="${esc(f.foto_principal || '')}">
        <input id="imgPrincLeg" placeholder="legenda / crédito" value="${esc(f.foto_principal_legenda || '')}" style="flex:1 1 140px"><button type="button" id="bImgPrinc">Salvar</button></div>` : ''}</div></div>`;
  if (fotos.length) h += `<p class="meta" style="margin-top:12px"><b>Fotos (${fotos.length})</b></p><div class="imggrid">` + fotos.map((x, i) => `<div>
      ${imgBox(x.url, x.legenda || 'Foto ' + (i + 1), 'width:100%;aspect-ratio:16/10')}
      ${x.legenda ? `<p class="meta" style="font-size:11px;margin:3px 0">${esc(x.legenda)}</p>` : ''}
      ${podeEditar ? `<div style="display:flex;gap:4px;margin-top:3px"><button type="button" data-imgprinc="${i}" style="font-size:11px;padding:2px 6px">★ principal</button>
        <button type="button" data-imgdel="${i}" class="perigo" style="font-size:11px;padding:2px 6px">×</button></div>` : ''}</div>`).join('') + '</div>';
  if (podeEditar) h += `<textarea id="imgNovas" rows="2" style="width:100%;margin-top:10px" placeholder="Adicionar fotos: um link por linha (para legenda: link | legenda)"></textarea>
    <div style="margin-top:6px"><button type="button" id="bImgAdd">+ Adicionar fotos</button></div>${dica}`;
  return h + '</div>';
}
async function salvarImagens(campos) {
  await updateDoc(doc(db, COL, editando.id), { ...campos, atualizado: serverTimestamp() });
  toast('Imagens salvas');
  await recarregarFicha(editando.id);
}
function imagensTmdb(d, f) {  // mesmo critério do tmdb_casar.py: só preenche o que falta
  const o = {};
  if (!f.poster && d.poster_path) o.poster = TMDB_IMG + 'w780' + d.poster_path;
  if (!f.foto_principal && d.backdrop_path) o.foto_principal = TMDB_IMG + 'w1280' + d.backdrop_path;
  if (!f.fotos?.length) {
    const fotos = [...(d.images?.backdrops || [])].sort((a, b) => (b.vote_average || 0) - (a.vote_average || 0))
      .filter(b => b.file_path && b.file_path !== d.backdrop_path).slice(0, 12).map(b => ({ url: TMDB_IMG + 'w1280' + b.file_path, legenda: 'TMDB' }));
    if (fotos.length) o.fotos = fotos;
  }
  return o;
}
function tmdbHtml(f) {
  let h = '<div style="margin-top:14px">';
  if (f.tmdb_id) {
    const t = f.tmdb || {};
    h += `<h3>TMDB <a href="${esc(t.url || 'https://www.themoviedb.org/movie/' + f.tmdb_id)}" target="_blank" rel="noopener">ID ${f.tmdb_id} ↗</a>
      ${podeEditar ? '<button type="button" id="bTmdbDesv" style="margin-left:auto;font-size:12px">Desvincular</button>' : ''}</h3>
      <p class="meta">${esc([t.titulo || '', t.titulo_original && t.titulo_original !== t.titulo ? t.titulo_original : '', t.direcao, t.data && t.data.split('-').reverse().join('/')].filter(Boolean).join(' · '))}</p>`;
    // com Cinemateca, sinopse/elenco já aparecem acima; sem ela, vêm do TMDB
    if (!f.cinemateca_id) h += `${f.sinopse ? `<p>${esc(f.sinopse)}</p>` : ''}
      ${f.elenco?.length ? `<p class="meta"><b>Elenco:</b> ${esc(f.elenco.slice(0, 12).join(', '))}</p>` : ''}`;
  } else {
    h += '<h3>TMDB</h3>';
    const cs = f.tmdb_candidatos || [];
    h += cs.length ? `<p class="meta">${f.tmdb_status === 'duvida' ? 'Qual destes é o filme?' : 'Nenhum candidato bom; os mais próximos:'}</p>${tmdbCandHtml(cs)}`
                   : '<p class="meta">Ainda não vinculado.</p>';
    if (podeEditar) h += `<div class="cinbusca"><input id="tmdbQ" placeholder="Buscar no TMDB" value="${esc(f.titulo.replace(/\(relan[cç]\.?\)/i, '').trim())}">
      <button type="button" id="bTmdbBusca">Buscar</button>
      <input id="tmdbCod" placeholder="ou ID / link" style="flex:0 1 130px"><button type="button" id="bTmdbCod">Vincular</button></div>
      <div id="tmdbRes"></div>`;
  }
  return h + '</div>';
}
async function tmdbBuscar(q) {
  const f = editando;
  const res = (await tmdbGet('/search/movie', { query: q, language: 'pt-BR', include_adult: 'false' })).results.slice(0, 8);
  await Promise.all(res.map(async m => {
    try { m.direcao = (await tmdbGet(`/movie/${m.id}/credits`)).crew.filter(p => p.job === 'Director').map(p => p.name).join(', '); } catch { m.direcao = ''; }
  }));
  const anos = [f.lancamento, f.brasilia, f.gramado].filter(Boolean);
  const nomes = s => new Set(norm(s).split(' ').filter(p => p.length > 2));
  return res.map(m => {
    const ano = m.release_date ? Number(m.release_date.slice(0, 4)) : null;
    let pts = 0;  // pontuação simples só para ordenar: ano e direção
    if (ano && anos.length) pts += Math.max(0, 30 - 8 * Math.min(...anos.map(a => Math.abs(a - ano))));
    if (f.diretor && m.direcao && [...nomes(f.diretor)].some(x => nomes(m.direcao).has(x))) pts += 25;
    return { id: m.id, titulo: m.title, titulo_original: m.original_title, ano, direcao: m.direcao, poster: m.poster_path, pontos: null, _o: pts };
  }).sort((a, b) => b._o - a._o);
}
async function tmdbVincular(id, btn) {
  if (btn) { btn.disabled = true; btn.textContent = 'Importando…'; }
  try {
    const d = await tmdbGet(`/movie/${id}`, { language: 'pt-BR', append_to_response: 'credits,images', include_image_language: 'pt,null,en' });
    const f = editando, dir = (d.credits?.crew || []).filter(p => p.job === 'Director').map(p => p.name).join(', ');
    const campos = {
      tmdb_id: d.id, tmdb_status: 'certo', tmdb_candidatos: deleteField(), atualizado: serverTimestamp(),
      tmdb: { id: d.id, titulo: d.title, titulo_original: d.original_title, data: d.release_date || null, duracao: d.runtime || null,
              sinopse: d.overview || null, direcao: dir, poster: d.poster_path || null, url: 'https://www.themoviedb.org/movie/' + d.id },
    };
    if (!f.sinopse && d.overview) campos.sinopse = d.overview;
    if (!f.duracao && d.runtime) campos.duracao = d.runtime;
    const el = (d.credits?.cast || []).slice(0, 12).map(p => p.character ? `${p.name} (${p.character})` : p.name);
    if (!f.elenco?.length && el.length) campos.elenco = el;
    Object.assign(campos, imagensTmdb(d, f));
    await updateDoc(doc(db, COL, f.id), campos);
    toast('Vinculado ao TMDB: ' + d.title);
    await recarregarFicha(f.id);
  } catch (err) { alert('Erro ao importar do TMDB: ' + err.message); if (btn) { btn.disabled = false; btn.textContent = 'É este'; } }
}
$('cinBox').addEventListener('click', async e => {
  const f = editando; if (!f || !podeEditar) return;
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.vincular) return vincular(b.dataset.vincular, b);
  if (b.dataset.tmdb) return tmdbVincular(b.dataset.tmdb, b);
  // imagens
  if (b.id === 'bImgPoster') return salvarImagens({ poster: $('imgPoster').value.trim() || deleteField() });
  if (b.id === 'bImgPrinc') return salvarImagens({ foto_principal: $('imgPrinc').value.trim() || deleteField(), foto_principal_legenda: $('imgPrincLeg').value.trim() || deleteField() });
  if (b.id === 'bImgAdd') {
    const linhas = $('imgNovas').value.split(/\n+/).map(l => l.trim()).filter(Boolean);
    const novas = linhas.map(l => { const [u, ...r] = l.split('|'); return { url: u.trim(), legenda: r.join('|').trim() }; }).filter(x => /^https?:\/\//i.test(x.url));
    if (novas.length < linhas.length) alert(`${linhas.length - novas.length} linha(s) ignorada(s): o link precisa começar com http:// ou https://`);
    if (novas.length) salvarImagens({ fotos: [...(f.fotos || []), ...novas] });
    return;
  }
  if (b.dataset.imgdel) {
    if (!confirm('Remover esta foto da lista? (o arquivo original não é apagado)')) return;
    return salvarImagens({ fotos: (f.fotos || []).filter((_, i) => i !== Number(b.dataset.imgdel)) });
  }
  if (b.dataset.imgprinc) {
    const i = Number(b.dataset.imgprinc), fotos = [...(f.fotos || [])], [x] = fotos.splice(i, 1);
    if (f.foto_principal) fotos.unshift({ url: f.foto_principal, legenda: f.foto_principal_legenda || '' });  // a antiga volta para a lista
    return salvarImagens({ foto_principal: x.url, foto_principal_legenda: x.legenda || deleteField(), fotos });
  }
  if (b.id === 'bTmdbCod') {
    const v = $('tmdbCod').value.trim(), m = v.match(/themoviedb\.org\/movie\/(\d+)/) || v.match(/^(\d+)$/);
    if (!m) { alert('Informe o ID numérico do TMDB ou cole o link do filme.'); return; }
    return tmdbVincular(m[1], b);
  }
  if (b.id === 'bTmdbBusca') {
    const q = $('tmdbQ').value.trim(); if (!q) return;
    $('tmdbRes').innerHTML = '<p class="meta">Buscando…</p>';
    try { const cs = await tmdbBuscar(q); $('tmdbRes').innerHTML = cs.length ? tmdbCandHtml(cs) : '<p class="meta">Nada encontrado.</p>'; }
    catch (err) { $('tmdbRes').innerHTML = `<p class="meta">Erro na busca: ${esc(err.message)}</p>`; }
    return;
  }
  if (b.id === 'bTmdbDesv') {
    if (!confirm('Desvincular do TMDB? Os dados e imagens que vieram do TMDB serão apagados (os da Cinemateca e os links que você colou ficam).')) return;
    const campos = { tmdb_status: 'nao_achado', tmdb_id: deleteField(), tmdb: deleteField() };
    // só apaga o que veio do TMDB — sinopse/elenco/duração da Cinemateca ficam
    if (!f.cinemateca_id) {
      if (f.tmdb?.sinopse && f.sinopse === f.tmdb.sinopse) campos.sinopse = deleteField();
      if (f.tmdb?.duracao && f.duracao === f.tmdb.duracao) campos.duracao = deleteField();
      if (f.elenco?.length) campos.elenco = deleteField();
    }
    const doTmdb = u => String(u || '').includes('image.tmdb.org');
    if (doTmdb(f.poster)) campos.poster = deleteField();
    if (doTmdb(f.foto_principal)) campos.foto_principal = deleteField();
    if (f.fotos?.some(x => doTmdb(x.url))) campos.fotos = f.fotos.filter(x => !doTmdb(x.url));
    await updateDoc(doc(db, COL, f.id), campos);
    await recarregarFicha(f.id); return;
  }
  if (b.id === 'bCinCod') { const c = $('cinCod').value.trim(); if (c) vincular(c.padStart(6, '0'), b); return; }
  if (b.id === 'bDesvincular') {
    if (!confirm('Desvincular da Cinemateca? Sinopse, elenco e duração importados serão apagados.')) return;
    const campos = { cinemateca_status: 'nao_achado' };
    ['cinemateca_id', 'cinemateca', 'sinopse', 'duracao', 'elenco', 'lancamento_cin', 'premios'].forEach(k => campos[k] = deleteField());
    await updateDoc(doc(db, COL, f.id), campos);
    await recarregarFicha(f.id); return;
  }
  if (b.id === 'bCinBusca') {
    const q = $('cinQ').value.trim(); if (!q) return;
    $('cinRes').innerHTML = '<p class="meta">Buscando…</p>';
    try {
      const p = new URLSearchParams({ q });
      const ano = f.lancamento || f.brasilia || f.gramado; if (ano) p.set('ano', ano);
      if (f.diretor) p.set('diretor', f.diretor);
      const r = await fetch(FN_CIN_BUSCA + '?' + p); const d = await r.json();
      if (!r.ok) throw new Error(d.error || r.status);
      $('cinRes').innerHTML = d.candidatos.length ? candHtml(d.candidatos.slice(0, 8)) : '<p class="meta">Nada encontrado.</p>';
    } catch (err) { $('cinRes').innerHTML = `<p class="meta">Erro na busca: ${esc(err.message)}</p>`; }
  }
});
$('cinBox').addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  e.preventDefault();  // não enviar o formulário do filme
  if (e.target.id === 'cinQ') $('bCinBusca').click();

  if (e.target.id === 'tmdbQ') $('bTmdbBusca').click();

});
async function vincular(codigo, btn) {
  btn.disabled = true; btn.textContent = 'Importando…';
  try {
    const r = await fetch(FN_CIN + '?id=' + encodeURIComponent(codigo)); const cd = await r.json();
    if (!r.ok) throw new Error(cd.error || r.status);
    await updateDoc(doc(db, COL, editando.id), { ...derivadosCin(cd), atualizado: serverTimestamp() });
    toast('Vinculado: ' + (cd['Título'] || codigo));
    await recarregarFicha(editando.id);
  } catch (err) { alert('Erro ao importar da Cinemateca: ' + err.message); btn.disabled = false; btn.textContent = 'É este'; }
}
async function recarregarFicha(id) {
  await carregar();
  const f = filmes.find(x => x.id === id); if (f) { editando = f; renderCin(); }
}
$('lista').addEventListener('click', e => {
  const id = e.target.closest('tr')?.dataset.id;
  const f = filmes.find(x => x.id === id); if (f) abrir(f);
});
$('bNovo').onclick = () => abrir(null);
$('bFechar').onclick = () => $('dlg').close();

const slug = s => norm(s).replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
frm.addEventListener('submit', async e => {
  e.preventDefault();
  const dados = {};
  for (const el of frm.elements) if (el.name) {
    const v = el.value.trim();
    dados[el.name] = v === '' ? null : NUM.includes(el.name) ? Number(v) : v;
  }
  // UF sem repetição e em ordem alfabética: 'RJ/RJ' → 'RJ', 'SP/RJ' → 'RJ/SP'
  if (dados.uf) dados.uf = [...new Set(dados.uf.toUpperCase().split(/[\/;,\s]+/).filter(Boolean))].sort().join('/') || null;
  dados.atualizado = serverTimestamp();
  try {
    let id = editando?.id;
    if (!id) {
      const base = slug(dados.titulo) + (dados.lancamento ? '-' + dados.lancamento : '');
      id = base;
      for (let i = 2; (await getDoc(doc(db, COL, id))).exists(); i++) id = base + '-' + i;
    }
    await setDoc(doc(db, COL, id), dados, { merge: true });  // merge: preserva os dados da Cinemateca/ANCINE
    $('dlg').close();
    toast('Salvo');
    await carregar();
  } catch (err) { alert('Erro ao salvar: ' + err.message); }
});
$('bExcluir').onclick = async () => {
  if (!editando || !confirm(`Excluir "${editando.titulo}"?`)) return;
  try { await deleteDoc(doc(db, COL, editando.id)); $('dlg').close(); toast('Excluído'); await carregar(); }
  catch (err) { alert('Erro ao excluir: ' + err.message); }
};

// ----- CSV -----
$('bCsv').onclick = () => {
  const cs = ['titulo', 'lancamento', 'brasilia', 'gramado', 'distribuidora', 'salas', 'publico', 'renda', 'diretor', 'genero', 'produtora', 'uf', 'obs', 'cpb',
              'cinemateca_id', 'duracao', 'lancamento_cin', 'sinopse', 'elenco'];
  const cel = v => v == null ? '' : Array.isArray(v) ? '"' + v.join(', ').replace(/"/g, '""') + '"' : typeof v === 'number' ? String(v).replace('.', ',') : '"' + String(v).replace(/"/g, '""') + '"';
  const txt = [cs.join(';'), ...filtrados().map(f => cs.map(c => cel(f[c])).join(';'))].join('\r\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob(['﻿' + txt], { type: 'text/csv;charset=utf-8' }));
  a.download = 'decada90.csv'; a.click();
};

carregar().catch(e => { $('lista').innerHTML = `<tr><td class="vazio">Erro ao carregar: ${esc(e.message)}</td></tr>`; });
