<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Década de 90 · OLGA</title>
<style>
  :root {
    --bg: #f6f4ef; --card: #fff; --tx: #1d1d1b; --mut: #6b6860; --ln: #e2ded4;
    --acc: #b8462e; --acc2: #f3e3dc; --ok: #2e7d4f;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #17171a; --card: #212126; --tx: #ecebe8; --mut: #9a988f; --ln: #34343a; --acc: #e0775c; --acc2: #3a2621; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--tx); font: 14px/1.4 system-ui, "Segoe UI", sans-serif; }
  header { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding: 14px 20px; border-bottom: 1px solid var(--ln); background: var(--card); position: sticky; top: 0; z-index: 5; }
  header h1 { font-size: 20px; margin: 0; letter-spacing: -.02em; }
  header h1 span { color: var(--acc); }
  header .sp { flex: 1; }
  #quem { color: var(--mut); font-size: 13px; }
  button { font: inherit; border: 1px solid var(--ln); background: var(--card); color: var(--tx); border-radius: 6px; padding: 6px 12px; cursor: pointer; }
  button:hover { border-color: var(--acc); }
  button.pri { background: var(--acc); border-color: var(--acc); color: #fff; }
  button.perigo { color: #c0392b; }
  main { padding: 16px 20px 40px; max-width: 1500px; margin: 0 auto; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; margin-bottom: 14px; }
  .tile { background: var(--card); border: 1px solid var(--ln); border-radius: 8px; padding: 10px 14px; }
  .tile b { display: block; font-size: 22px; font-variant-numeric: tabular-nums; }
  .tile small { color: var(--mut); }
  .filtros { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; align-items: center; }
  input, select, textarea { font: inherit; color: var(--tx); background: var(--card); border: 1px solid var(--ln); border-radius: 6px; padding: 6px 8px; }
  #busca { flex: 1 1 240px; }
  .tabwrap { background: var(--card); border: 1px solid var(--ln); border-radius: 8px; overflow: auto; max-height: calc(100vh - 250px); }
  table { border-collapse: collapse; width: 100%; }
  th, td { padding: 7px 10px; border-bottom: 1px solid var(--ln); text-align: left; vertical-align: top; }
  th { position: sticky; top: 0; background: var(--card); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--mut); cursor: pointer; white-space: nowrap; user-select: none; }
  th.on { color: var(--acc); }
  td.n { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  th.n { text-align: right; }
  tbody tr { cursor: pointer; }
  tbody tr:hover { background: var(--acc2); }
  td.t { font-weight: 600; }
  td .sub { display: block; font-weight: 400; color: var(--mut); font-size: 12px; }
  .vazio { color: var(--mut); }
  .fest { display: inline-block; font-size: 11px; padding: 1px 6px; border-radius: 10px; background: var(--acc2); color: var(--acc); margin: 0 3px 2px 0; white-space: nowrap; }
  dialog { border: 1px solid var(--ln); border-radius: 10px; background: var(--card); color: var(--tx); width: min(720px, 94vw); padding: 0; }
  dialog::backdrop { background: rgba(0,0,0,.45); }
  dialog form { padding: 18px 20px; }
  dialog h2 { margin: 0 0 14px; font-size: 18px; }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px 12px; }
  .grid label { display: flex; flex-direction: column; gap: 3px; font-size: 12px; color: var(--mut); }
  .grid .w2 { grid-column: span 2; } .grid .w4 { grid-column: span 4; }
  .acoes { display: flex; gap: 8px; margin-top: 16px; }
  .acoes .sp { flex: 1; }
  #msg { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); background: var(--tx); color: var(--bg); padding: 8px 16px; border-radius: 6px; opacity: 0; transition: opacity .2s; pointer-events: none; }
  #msg.on { opacity: 1; }
  @media (max-width: 640px) { .grid { grid-template-columns: 1fr 1fr; } .grid .w4 { grid-column: span 2; } main, header { padding-left: 12px; padding-right: 12px; } }
</style>
</head>
<body>
<header>
  <h1>Década de <span>90</span></h1>
  <small style="color:var(--mut)">filmes brasileiros 1990–2001</small>
  <div class="sp"></div>
  <span id="quem"></span>
  <button id="bNovo" class="pri" hidden>+ Filme</button>
  <button id="bCsv">Exportar CSV</button>
  <button id="bLogin">Entrar</button>
</header>
<main>
  <div class="tiles" id="tiles"></div>
  <div class="filtros">
    <input id="busca" type="search" placeholder="Buscar título, direção, produtora, distribuidora…">
    <select id="fAno"></select>
    <select id="fGen"></select>
    <select id="fFest">
      <option value="">Festivais: todos</option>
      <option value="brasilia">Brasília</option>
      <option value="gramado">Gramado</option>
      <option value="ambos">Brasília e Gramado</option>
      <option value="algum">Algum festival</option>
      <option value="nenhum">Nenhum festival</option>
    </select>
    <select id="fUf"></select>
    <select id="fDist"></select>
    <button id="bLimpa">Limpar</button>
  </div>
  <div class="tabwrap"><table>
    <thead><tr id="cab"></tr></thead>
    <tbody id="lista"><tr><td class="vazio">Carregando…</td></tr></tbody>
  </table></div>
</main>

<dialog id="dlg"><form method="dialog" id="frm">
  <h2 id="dlgTit">Filme</h2>
  <div class="grid">
    <label class="w4">Título<input name="titulo" required></label>
    <label>Lançamento<input name="lancamento" type="number" min="1980" max="2010"></label>
    <label>Festival Brasília<input name="brasilia" type="number" min="1980" max="2010"></label>
    <label>Festival Gramado<input name="gramado" type="number" min="1980" max="2010"></label>
    <label>Gênero<input name="genero" list="dlGen"></label>
    <label class="w2">Direção<input name="diretor"></label>
    <label class="w2">Distribuidora<input name="distribuidora" list="dlDist"></label>
    <label class="w2">Produtora<input name="produtora"></label>
    <label>UF<input name="uf"></label>
    <label>Salas (máx)<input name="salas" type="number" min="0"></label>
    <label>Público<input name="publico" type="number" min="0"></label>
    <label>Renda (R$)<input name="renda" type="number" min="0" step="0.01"></label>
    <label class="w4">Observações<textarea name="obs" rows="3"></textarea></label>
  </div>
  <div class="acoes">
    <button type="button" id="bExcluir" class="perigo">Excluir</button>
    <div class="sp"></div>
    <button type="button" id="bFechar">Fechar</button>
    <button type="submit" id="bSalvar" class="pri">Salvar</button>
  </div>
</form></dialog>
<datalist id="dlGen"></datalist><datalist id="dlDist"></datalist>
<div id="msg"></div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';
import { getFirestore, collection, getDocs, doc, getDoc, setDoc, deleteDoc, serverTimestamp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

const app = initializeApp({
  apiKey: "AIzaSyDIBhcsqlK3QebTmbWMNqsN_rPPybREj64",
  authDomain: "olga-suite.firebaseapp.com",
  projectId: "olga-suite",
});
const auth = getAuth(app), db = getFirestore(app);
const COL = 'decada90_filmes', DONO = 'lg.rchrd@gmail.com';
const $ = id => document.getElementById(id);

let filmes = [], podeEditar = false, editando = null;
let ordem = { campo: 'titulo', dir: 1 };

const COLS = [
  ['titulo', 'Título'], ['lancamento', 'Lanç.', 'n'], ['fest', 'Festivais'], ['genero', 'Gênero'],
  ['distribuidora', 'Distribuidora'], ['salas', 'Salas', 'n'], ['publico', 'Público', 'n'],
  ['renda', 'Renda (R$)', 'n'], ['uf', 'UF'],
];
const NUM = ['lancamento', 'brasilia', 'gramado', 'salas', 'publico', 'renda'];
const fmt = (v, dec = 0) => v == null ? '' : Number(v).toLocaleString('pt-BR', { minimumFractionDigits: dec, maximumFractionDigits: dec });
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const norm = s => String(s ?? '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
const toast = t => { const m = $('msg'); m.textContent = t; m.classList.add('on'); setTimeout(() => m.classList.remove('on'), 2200); };

async function carregar() {
  const snap = await getDocs(collection(db, COL));
  filmes = snap.docs.map(d => ({ id: d.id, ...d.data() }));
  montarFiltros();
  render();
}

function opcoes(sel, rot, vals) {
  const atual = sel.value;
  sel.innerHTML = `<option value="">${rot}: todos</option>` + vals.map(v => `<option value="${esc(v)}">${esc(v)}</option>`).join('');
  sel.value = vals.map(String).includes(atual) || atual === '__sem' ? atual : '';
}
function unicos(campo) {
  return [...new Set(filmes.map(f => f[campo]).filter(v => v != null && v !== ''))].sort((a, b) => String(a).localeCompare(String(b), 'pt-BR'));
}
function montarFiltros() {
  opcoes($('fAno'), 'Lançamento', unicos('lancamento'));
  $('fAno').insertAdjacentHTML('beforeend', '<option value="__sem">Sem lançamento</option>');
  opcoes($('fGen'), 'Gênero', unicos('genero'));
  opcoes($('fUf'), 'UF', unicos('uf'));
  opcoes($('fDist'), 'Distribuidora', unicos('distribuidora'));
  $('dlGen').innerHTML = unicos('genero').map(v => `<option value="${esc(v)}">`).join('');
  $('dlDist').innerHTML = unicos('distribuidora').map(v => `<option value="${esc(v)}">`).join('');
}

function filtrados() {
  const q = norm($('busca').value).trim(), ano = $('fAno').value, gen = $('fGen').value,
        fest = $('fFest').value, uf = $('fUf').value, dist = $('fDist').value;
  return filmes.filter(f => {
    if (q && !norm([f.titulo, f.diretor, f.produtora, f.distribuidora, f.obs].join(' ')).includes(q)) return false;
    if (ano === '__sem' ? f.lancamento != null : ano && String(f.lancamento) !== ano) return false;
    if (gen && f.genero !== gen) return false;
    if (uf && f.uf !== uf) return false;
    if (dist && f.distribuidora !== dist) return false;
    const b = f.brasilia != null, g = f.gramado != null;
    if (fest === 'brasilia' && !b || fest === 'gramado' && !g || fest === 'ambos' && !(b && g)
        || fest === 'algum' && !(b || g) || fest === 'nenhum' && (b || g)) return false;
    return true;
  });
}

function render() {
  const lista = filtrados();
  const { campo, dir } = ordem;
  const val = f => campo === 'fest' ? Math.min(f.brasilia ?? 9999, f.gramado ?? 9999) : f[campo];
  lista.sort((a, b) => {
    const x = val(a), y = val(b);
    if (x == null || x === 9999) return 1;
    if (y == null || y === 9999) return -1;
    return (typeof x === 'number' ? x - y : String(x).localeCompare(String(y), 'pt-BR')) * dir;
  });

  const soma = c => lista.reduce((s, f) => s + (f[c] || 0), 0);
  $('tiles').innerHTML = [
    [fmt(lista.length), lista.length === filmes.length ? 'filmes' : `de ${fmt(filmes.length)} filmes`],
    [fmt(lista.filter(f => f.lancamento != null).length), 'com lançamento comercial'],
    [fmt(soma('publico')), 'público somado'],
    ['R$ ' + fmt(soma('renda')), 'renda somada'],
    [fmt(lista.filter(f => f.brasilia != null).length) + ' / ' + fmt(lista.filter(f => f.gramado != null).length), 'em Brasília / Gramado'],
  ].map(([b, s]) => `<div class="tile"><b>${b}</b><small>${s}</small></div>`).join('');

  $('cab').innerHTML = COLS.map(([c, r, n]) =>
    `<th data-c="${c}" class="${n || ''} ${c === campo ? 'on' : ''}">${r}${c === campo ? (dir > 0 ? ' ▲' : ' ▼') : ''}</th>`).join('');

  $('lista').innerHTML = lista.length ? lista.map(f => `<tr data-id="${esc(f.id)}">
    <td class="t">${esc(f.titulo)}<span class="sub">${esc(f.diretor)}</span></td>
    <td class="n">${f.lancamento ?? ''}</td>
    <td>${f.brasilia != null ? `<span class="fest">Brasília ${f.brasilia}</span>` : ''}${f.gramado != null ? `<span class="fest">Gramado ${f.gramado}</span>` : ''}</td>
    <td>${esc(f.genero)}</td>
    <td>${esc(f.distribuidora)}</td>
    <td class="n">${fmt(f.salas)}</td>
    <td class="n">${fmt(f.publico)}</td>
    <td class="n">${fmt(f.renda)}</td>
    <td>${esc(f.uf)}</td>
  </tr>`).join('') : `<tr><td colspan="${COLS.length}" class="vazio">Nenhum filme com esses filtros.</td></tr>`;
}

$('cab').addEventListener('click', e => {
  const c = e.target.closest('th')?.dataset.c; if (!c) return;
  ordem = ordem.campo === c ? { campo: c, dir: -ordem.dir } : { campo: c, dir: NUM.includes(c) && c !== 'lancamento' ? -1 : 1 };
  render();
});
['busca', 'fAno', 'fGen', 'fFest', 'fUf', 'fDist'].forEach(id => $(id).addEventListener('input', render));
$('bLimpa').onclick = () => { ['busca', 'fAno', 'fGen', 'fFest', 'fUf', 'fDist'].forEach(id => $(id).value = ''); render(); };

// ----- ficha -----
const frm = $('frm');
function abrir(f) {
  editando = f;
  $('dlgTit').textContent = f ? f.titulo : 'Novo filme';
  for (const el of frm.elements) if (el.name) { el.value = f?.[el.name] ?? ''; el.disabled = !podeEditar; }
  $('bSalvar').hidden = !podeEditar;
  $('bExcluir').hidden = !podeEditar || !f;
  $('dlg').showModal();
}
$('lista').addEventListener('click', e => {
  const id = e.target.closest('tr')?.dataset.id;
  const f = filmes.find(x => x.id === id); if (f) abrir(f);
});
$('bNovo').onclick = () => abrir(null);
$('bFechar').onclick = () => $('dlg').close();

const slug = s => norm(s).replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
frm.addEventListener('submit', async e => {
  e.preventDefault();
  const dados = {};
  for (const el of frm.elements) if (el.name) {
    const v = el.value.trim();
    dados[el.name] = v === '' ? null : NUM.includes(el.name) ? Number(v) : v;
  }
  dados.atualizado = serverTimestamp();
  try {
    let id = editando?.id;
    if (!id) {
      const base = slug(dados.titulo) + (dados.lancamento ? '-' + dados.lancamento : '');
      id = base;
      for (let i = 2; (await getDoc(doc(db, COL, id))).exists(); i++) id = base + '-' + i;
    }
    await setDoc(doc(db, COL, id), dados);
    $('dlg').close();
    toast('Salvo');
    await carregar();
  } catch (err) { alert('Erro ao salvar: ' + err.message); }
});
$('bExcluir').onclick = async () => {
  if (!editando || !confirm(`Excluir "${editando.titulo}"?`)) return;
  try { await deleteDoc(doc(db, COL, editando.id)); $('dlg').close(); toast('Excluído'); await carregar(); }
  catch (err) { alert('Erro ao excluir: ' + err.message); }
};

// ----- CSV -----
$('bCsv').onclick = () => {
  const cs = ['titulo', 'lancamento', 'brasilia', 'gramado', 'distribuidora', 'salas', 'publico', 'renda', 'diretor', 'genero', 'produtora', 'uf', 'obs'];
  const cel = v => v == null ? '' : typeof v === 'number' ? String(v).replace('.', ',') : '"' + String(v).replace(/"/g, '""') + '"';
  const txt = [cs.join(';'), ...filtrados().map(f => cs.map(c => cel(f[c])).join(';'))].join('\r\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob(['﻿' + txt], { type: 'text/csv;charset=utf-8' }));
  a.download = 'decada90.csv'; a.click();
};

// ----- login -----
$('bLogin').onclick = () => auth.currentUser ? signOut(auth) : signInWithPopup(auth, new GoogleAuthProvider()).catch(e => alert(e.message));
onAuthStateChanged(auth, u => {
  podeEditar = !!u && u.email === DONO;
  $('bLogin').textContent = u ? 'Sair' : 'Entrar';
  $('quem').textContent = u ? (podeEditar ? u.email : u.email + ' (só leitura)') : '';
  $('bNovo').hidden = !podeEditar;
});

carregar().catch(e => { $('lista').innerHTML = `<tr><td class="vazio">Erro ao carregar: ${esc(e.message)}</td></tr>`; });
</script>
</body>
</html>
